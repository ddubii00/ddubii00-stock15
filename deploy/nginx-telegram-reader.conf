# Include INSIDE your existing HTTPS server { ... } block.
# APP_ORIGIN must match that server's HTTPS origin, without /stock15-7/.
location = /stock15-7 {
    return 308 /stock15-7/;
}

# Public Vite JS/CSS/assets are served directly by nginx.
# Both paths must end with /; ^~ prevents other regex locations taking priority.
location ^~ /stock15-7/assets/ {
    alias /var/www/stock15-7/frontend/dist/assets/;
    access_log off;
    add_header Cache-Control "no-store" always;
}

# FastAPI serves HTML, favicon and authenticated API requests.
location /stock15-7/ {
    # The trailing / strips /stock15-7/ before forwarding to FastAPI root_path.
    proxy_pass http://127.0.0.1:8017/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 300s;
    client_max_body_size 64k;
    access_log off;
    add_header Cache-Control "no-store" always;
}
